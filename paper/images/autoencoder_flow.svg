<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="'DM Sans', system-ui, sans-serif">
  <defs>
    <marker id="ae-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A2A1F" />
    </marker>
  </defs>

  <!-- INPUT column -->
  <text x="90" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#0A2A1F" letter-spacing="2">INPUT  x</text>
  <g stroke="#0A2A1F" stroke-width="1.6" fill="#D1FFE6">
    <circle cx="90" cy="90"  r="13" />
    <circle cx="90" cy="125" r="13" />
    <circle cx="90" cy="160" r="13" />
    <circle cx="90" cy="195" r="13" />
    <circle cx="90" cy="230" r="13" />
    <circle cx="90" cy="265" r="13" />
    <circle cx="90" cy="300" r="13" />
  </g>

  <!-- ENCODER trapezoid (narrows L -> R) -->
  <polygon points="170,80 360,150 360,250 170,310"
           fill="#63FF91" fill-opacity="0.22" stroke="#0A2A1F" stroke-width="2" />
  <text x="265" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#0A2A1F">Encoder</text>

  <!-- LATENT column -->
  <text x="440" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#0A2A1F" letter-spacing="2">LATENT  z</text>
  <g stroke="#0A2A1F" stroke-width="2" fill="#63FF91">
    <circle cx="440" cy="170" r="16" />
    <circle cx="440" cy="210" r="16" />
    <circle cx="440" cy="250" r="16" />
  </g>

  <!-- DECODER trapezoid (widens L -> R) -->
  <polygon points="520,150 710,80 710,310 520,250"
           fill="#7099FF" fill-opacity="0.20" stroke="#2B3B64" stroke-width="2" />
  <text x="615" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#2B3B64">Decoder</text>

  <!-- OUTPUT column -->
  <text x="790" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#2B3B64" letter-spacing="2">OUTPUT  x&#770;</text>
  <g stroke="#2B3B64" stroke-width="1.6" fill="#ABCFFA">
    <circle cx="790" cy="90"  r="13" />
    <circle cx="790" cy="125" r="13" />
    <circle cx="790" cy="160" r="13" />
    <circle cx="790" cy="195" r="13" />
    <circle cx="790" cy="230" r="13" />
    <circle cx="790" cy="265" r="13" />
    <circle cx="790" cy="300" r="13" />
  </g>

  <!-- Reconstruction-loss callout -->
  <path d="M790 332 Q 440 360 90 332"
        stroke="#0A2A1F" stroke-width="1.4" stroke-dasharray="5 4"
        fill="none" marker-end="url(#ae-arr)" />
  <text x="440" y="355" text-anchor="middle" font-size="13" font-style="italic" fill="#0A2A1F">
    minimise &#8214; x &#8722; x&#770; &#8214;<tspan baseline-shift="super" font-size="9">2</tspan>
  </text>
</svg>
