# Apply in your chosen namespace: kubectl apply -f deploy/vllm.yml
# Requires NVIDIA GPU support; no persistent storage or volume mounts.
# Default model: Nemotron 3.5 Nano BF16, targeting one A100/H100 with 80 GB VRAM.
# The Nano Hugging Face ID currently redirects to the Lightning checkpoint.
# Adjust model, context length, and CPU/RAM for your hardware.
# Model downloads use the container writable layer and are lost on replacement.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiji-vllm
spec:
  replicas: 1
  # Release the GPU before starting the replacement.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kiji-vllm
  template:
    metadata:
      labels:
        app: kiji-vllm
    spec:
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      # Uncomment if your cluster requires an explicit NVIDIA RuntimeClass.
      # runtimeClassName: nvidia
      # Add tolerations here if your GPU nodes are tainted.
      # Add your cluster's GPU-type node label to nodeSelector to require 80 GB VRAM.
      # nvidia.com/gpu counts GPUs; it does not select their memory capacity.
      containers:
        - name: vllm
          image: 575lab/kiji-inspector:dev
          # The published dev tag can change. Pin a digest for reproducibility.
          imagePullPolicy: Always
          # This image installs vLLM but does not start an API server by default.
          command: ["/opt/venv/bin/vllm"]
          args:
            - serve
            - nvidia/NVIDIA-Nemotron-3.5-Nano-30B-A3B-BF16
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --tensor-parallel-size
            - "1"
            - --dtype
            - bfloat16
            - --max-model-len
            - "4096"
            - --max-num-seqs
            - "16"
            # Required by the fork's hidden-state extraction path.
            - --no-enable-chunked-prefill
            - --max-num-batched-tokens
            - "4096"
            - --gpu-memory-utilization
            - "0.90"
            # Capture the six trained demo layers (use [43] for a smaller capture).
            # Layer IDs follow the fork's native auxiliary-hidden-state convention.
            - --speculative-config
            - >-
              {"method":"extract_hidden_states","num_speculative_tokens":1,
              "draft_model_config":{"hf_config":{
              "eagle_aux_hidden_state_layer_ids":[6,13,20,27,34,43]}}}
            # HTTP clients set kv_transfer_params.return_inline=true per request.
            # The storage path is only a fallback for requests without inline return.
            - --kv-transfer-config
            - >-
              {"kv_connector":"ExampleHiddenStatesConnector","kv_role":"kv_producer",
              "kv_connector_extra_config":{"shared_storage_path":"/tmp/kiji-hidden-states",
              "use_synchronization_lock":true}}
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            # Optional: create this Secret for gated/private models.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 128Gi
              # Match --tensor-parallel-size when using multiple GPUs.
              nvidia.com/gpu: "1"
          # Allow up to 30 minutes for model download, loading, and compilation.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kiji-vllm
spec:
  type: ClusterIP
  selector:
    app: kiji-vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
