  <text x="117" y="113" text-anchor="middle" font-size="9.5" fill="#ffffff" fill-opacity="0.85">500K pairs, 5 domains</text>
  <text x="117" y="127" text-anchor="middle" font-size="9.5" fill="#ffffff" fill-opacity="0.85">32 tools, 37 contrast types</text>
  <circle cx="117" cy="37" r="11" fill="#06312E"></circle>
