<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 170 1100 388" font-family="Helvetica Neue, Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#06312E" flood-opacity="0.12"></feDropShadow>
    </filter>
    <linearGradient id="grad-topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06312E"></stop>
      <stop offset="100%" stop-color="#06312E"></stop>
    </linearGradient>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06312E"></stop>
      <stop offset="100%" stop-color="#06312E"></stop>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06312E"></stop>
      <stop offset="100%" stop-color="#06312E"></stop>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06312E"></stop>
      <stop offset="100%" stop-color="#06312E"></stop>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3EDAB2"></polygon>
    </marker>
    <marker id="arr-navy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06312E"></polygon>
    </marker>
    <marker id="arr-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06312E"></polygon>
    </marker>
    <marker id="arr-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#929088"></polygon>
    </marker>
  </defs>

  
  <rect width="1100" height="560" fill="#F8F4E4" rx="8"></rect>
  <rect width="1100" height="4" fill="url(#grad-topbar)" rx="2"></rect>

  
  
  
  <g filter="url(#shadow)">
    <rect x="40" y="210" width="130" height="70" rx="10" fill="#FFFEF9" stroke="#EEEDEA" stroke-width="1.5"></rect>
  </g>
  <text x="105" y="236" text-anchor="middle" font-size="16.2" fill="#929088" font-weight="600">INPUT</text>
  <text x="105" y="255" text-anchor="middle" font-size="18.9" fill="#06312E" font-weight="700">x</text>
  <text x="105" y="272" text-anchor="middle" font-size="13.5" fill="#929088">d_model = 2,688</text>

  
  
  

  
  <line x1="170" y1="235" x2="218" y2="235" stroke="#3EDAB2" stroke-width="2" marker-end="url(#arr)"></line>

  
  <g filter="url(#shadow)">
    <rect x="225" y="210" width="95" height="50" rx="8" fill="#FFFEF9" stroke="#EEEDEA" stroke-width="1.5"></rect>
  </g>
  <text x="272" y="234" text-anchor="middle" font-size="16.2" fill="#06312E" font-weight="700">x - b_dec</text>
  <text x="272" y="250" text-anchor="middle" font-size="12.2" fill="#929088">center input</text>

  
  <line x1="320" y1="235" x2="358" y2="235" stroke="#3EDAB2" stroke-width="2" marker-end="url(#arr)"></line>

  
  <g filter="url(#shadow)">
    <rect x="365" y="195" width="140" height="80" rx="10" fill="url(#grad-primary)"></rect>
  </g>
  <text x="435" y="222" text-anchor="middle" font-size="16.2" fill="#ffffff" font-weight="700">W_enc @ (...)</text>
  <text x="435" y="240" text-anchor="middle" font-size="14.9" fill="#ffffff">+ b_enc</text>
  <text x="435" y="260" text-anchor="middle" font-size="12.2" fill="#cbd5e0">2,688 x 10,752</text>

  
  <line x1="505" y1="235" x2="543" y2="235" stroke="#3EDAB2" stroke-width="2" marker-end="url(#arr)"></line>

  
  <g filter="url(#shadow)">
    <rect x="550" y="210" width="110" height="50" rx="8" fill="#FFFEF9" stroke="#EEEDEA" stroke-width="1.5"></rect>
  </g>
  <text x="605" y="233" text-anchor="middle" font-size="14.9" fill="#06312E" font-weight="600">pre_activation</text>
  <text x="605" y="249" text-anchor="middle" font-size="13.5" fill="#929088">d_sae = 10,752</text>

  
  <line x1="660" y1="235" x2="698" y2="235" stroke="#3EDAB2" stroke-width="2" marker-end="url(#arr)"></line>

  
  <g filter="url(#shadow)">
    <rect x="705" y="185" width="155" height="100" rx="12" fill="url(#grad-accent)"></rect>
  </g>
  <text x="782" y="212" text-anchor="middle" font-size="17.6" fill="#ffffff" font-weight="700">JumpReLU</text>
  <text x="782" y="232" text-anchor="middle" font-size="13.5" fill="#ffffff" fill-opacity="0.9">z * H(z - θ)</text>
  <text x="782" y="252" text-anchor="middle" font-size="12.8" fill="#ffffff" fill-opacity="0.85">learnable θ per feature</text>
  <text x="782" y="270" text-anchor="middle" font-size="12.2" fill="#ffffff" fill-opacity="0.7">exact zeros (true sparsity)</text>

  
  <line x1="860" y1="235" x2="898" y2="235" stroke="#3EDAB2" stroke-width="2" marker-end="url(#arr)"></line>

  
  <g filter="url(#shadow)">
    <rect x="905" y="200" width="155" height="70" rx="10" fill="url(#grad-teal)"></rect>
  </g>
  <text x="982" y="225" text-anchor="middle" font-size="16.2" fill="#ffffff" font-weight="700">features (sparse)</text>
  <text x="982" y="244" text-anchor="middle" font-size="13.5" fill="#ffffff" fill-opacity="0.9">d_sae = 10,752</text>
  <text x="982" y="260" text-anchor="middle" font-size="12.8" fill="#ffffff" fill-opacity="0.85">~668 active (~6%)</text>

  
  
  

  
  <line x1="982" y1="270" x2="982" y2="335" stroke="#06312E" stroke-width="2" marker-end="url(#arr-navy)"></line>

  
  <g filter="url(#shadow)">
    <rect x="910" y="342" width="145" height="75" rx="10" fill="url(#grad-primary)"></rect>
  </g>
  <text x="982" y="367" text-anchor="middle" font-size="16.2" fill="#ffffff" font-weight="700">W_dec @ features</text>
  <text x="982" y="385" text-anchor="middle" font-size="14.9" fill="#ffffff">+ b_dec</text>
  <text x="982" y="403" text-anchor="middle" font-size="12.2" fill="#cbd5e0">10,752 x 2,688</text>

  
  <line x1="910" y1="380" x2="855" y2="380" stroke="#06312E" stroke-width="2" marker-end="url(#arr-navy)"></line>

  
  <g filter="url(#shadow)">
    <rect x="700" y="350" width="148" height="60" rx="10" fill="#FFFEF9" stroke="#06312E" stroke-width="1.5"></rect>
  </g>
  <text x="774" y="374" text-anchor="middle" font-size="16.2" fill="#06312E" font-weight="700">reconstruction</text>
  <text x="774" y="393" text-anchor="middle" font-size="13.5" fill="#929088">d_model = 2,688</text>

  
  
  

  
  <line x1="700" y1="380" x2="620" y2="380" stroke="#929088" stroke-width="1.5" marker-end="url(#arr-gray)"></line>

  
  <g filter="url(#shadow)">
    <rect x="460" y="348" width="155" height="65" rx="10" fill="#FFFEF9" stroke="#EEEDEA" stroke-width="1.5"></rect>
  </g>
  <text x="537" y="370" text-anchor="middle" font-size="14.9" fill="#06312E" font-weight="700">Loss</text>
  <text x="537" y="388" text-anchor="middle" font-size="12.8" fill="#929088">MSE(x, reconstruction)</text>
  <text x="537" y="402" text-anchor="middle" font-size="12.8" fill="#929088">+ λ * tanh L0 sparsity</text>

  
  <line x1="105" y1="280" x2="105" y2="380" stroke="#929088" stroke-width="1.5"></line>
  <line x1="105" y1="380" x2="453" y2="380" stroke="#929088" stroke-width="1.5" marker-end="url(#arr-gray)"></line>
  <text x="280" y="395" text-anchor="middle" font-size="12.2" fill="#929088" font-weight="600">compare x with reconstruction</text>

  
  
  
  <path d="M 272 210 L 272 180 L 25 180 L 25 440 L 982 440 L 982 417" stroke="#929088" stroke-width="1" fill="none" stroke-dasharray="4,3"></path>
  <text x="627" y="452" text-anchor="middle" font-size="12.2" fill="#929088" font-weight="600">b_dec shared (subtract before encode, add after decode)</text>

  
  
  
  <text x="982" y="432" text-anchor="middle" font-size="12.2" fill="#06312E" font-weight="600">W_dec columns normalized to unit norm</text>

  
  
  
  <g filter="url(#shadow)">
    <rect x="40" y="460" width="1020" height="80" rx="8" fill="#FFFEF9" stroke="#EEEDEA" stroke-width="1"></rect>
  </g>

  <text x="60" y="485" font-size="14.9" fill="#06312E" font-weight="700">Parameters</text>

  <rect x="60" y="496" width="14" height="14" rx="3" fill="#06312E"></rect>
  <text x="82" y="508" font-size="13.5" fill="#1A1A1A" font-weight="600">W_enc</text>
  <text x="130" y="508" font-size="12.8" fill="#929088">(2,688 x 10,752)</text>

  <rect x="240" y="496" width="14" height="14" rx="3" fill="#06312E"></rect>
  <text x="262" y="508" font-size="13.5" fill="#1A1A1A" font-weight="600">W_dec</text>
  <text x="312" y="508" font-size="12.8" fill="#929088">(10,752 x 2,688)</text>

  <rect x="420" y="496" width="14" height="14" rx="3" fill="#06312E"></rect>
  <text x="442" y="508" font-size="13.5" fill="#1A1A1A" font-weight="600">θ</text>
  <text x="462" y="508" font-size="12.8" fill="#929088">(10,752) thresholds</text>

  <rect x="590" y="496" width="14" height="14" rx="3" fill="#929088"></rect>
  <text x="612" y="508" font-size="13.5" fill="#1A1A1A" font-weight="600">b_enc</text>
  <text x="660" y="508" font-size="12.8" fill="#929088">(10,752)</text>

  <rect x="720" y="496" width="14" height="14" rx="3" fill="#929088"></rect>
  <text x="742" y="508" font-size="13.5" fill="#1A1A1A" font-weight="600">b_dec</text>
  <text x="790" y="508" font-size="12.8" fill="#929088">(2,688) shared</text>

  <text x="60" y="530" font-size="13.5" fill="#929088">Total: ~58M trainable parameters</text>
  <text x="350" y="530" font-size="13.5" fill="#929088">Activation: JumpReLU with STE pseudo-gradients</text>
  <text x="700" y="530" font-size="13.5" fill="#929088">Loss: MSE + λ * tanh-smoothed L0</text>
</svg>