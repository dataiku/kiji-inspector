  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

B, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"80a8c3af-be93-43d8-8971-d13ee6e228ca\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    * { box-sizing: border-box; }\n    body { margin: 0; background: #E7E3D2; }\n    .kp-sup { font-size: 0.6em; vertical-align: super; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width: 2160px; margin: 0 auto; background: #FFFEF9; font-family: 'IBM Plex Sans', sans-serif; color: #2D3748;\">\n\n  <!-- ===================== HEADER ===================== -->\n  <header style=\"background: #06312E; padding: 30px 40px 30px; display: flex; align-items: stretch; gap: 34px;\">\n    <!-- QR -->\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 10px; flex-shrink: 0; width: 168px;\">\n      <img src=\"f02f1d35-2e52-491c-b2ca-eb276a4d9a7d\" alt=\"QR code linking to paper and code\" style=\"width: 168px; height: 168px; display: block; border-radius: 14px;\">\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #7FB0A6; letter-spacing: 0.04em;\">Scan for paper + code<\u002Fdiv>\n    <\u002Fdiv>\n    <!-- Title block -->\n    <div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column;\">\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: #3EDAB2; letter-spacing: 0.24em;\">● MECHANISTIC INTERPRETABILITY · AGENTIC AI<\u002Fdiv>\n      <h1 style=\"margin: 14px 0 0; color: #FFFFFF; font-weight: 700; font-size: 43px; line-height: 1.12; letter-spacing: -0.018em;\">Opening the Black Box: Mechanistic Interpretability of <span style=\"color: #3EDAB2;\">Agent Tool Selection<\u002Fspan> with Sparse Autoencoders<\u002Fh1>\n      <div style=\"margin-top: auto; padding-top: 22px;\">\n        <div style=\"color: #FFFFFF; font-size: 20px; font-weight: 600;\">Hannes Hapke<span class=\"kp-sup\">1<\u002Fspan> &nbsp;&nbsp; David Cardozo<span class=\"kp-sup\">1<\u002Fspan> &nbsp;&nbsp; Carlos Huisa<span class=\"kp-sup\">1<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 14.5px; color: #8FB7AF;\"><span class=\"kp-sup\">1<\u002Fspan> 575 Lab, Dataiku Inc. — Portland, OR &amp; Toronto, ON &amp; Austin, TX<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- Right meta -->\n    <div style=\"flex-shrink: 0; width: 430px; display: flex; flex-direction: column; align-items: flex-end; text-align: right;\">\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 16px; line-height: 1.45; color: #7FB0A6;\">Mechanistic<br>Interpretability<br>for AI Agents<\u002Fdiv>\n      <div style=\"margin-top: auto; padding-top: 22px; display: flex; flex-direction: column; gap: 7px; align-items: flex-end; font-family: 'IBM Plex Mono', monospace; font-size: 14.5px;\">\n        <div style=\"white-space: nowrap;\"><span style=\"color: #6E9B92;\">subject<\u002Fspan> &nbsp; <span style=\"color: #E4F2ED; font-weight: 600;\">Nemotron-3-Nano-30B<\u002Fspan><\u002Fdiv>\n        <div style=\"white-space: nowrap;\"><span style=\"color: #6E9B92;\">gen·label·judge<\u002Fspan> &nbsp; <span style=\"color: #E4F2ED; font-weight: 600;\">Qwen3-VL-235B<\u002Fspan><\u002Fdiv>\n        <div style=\"white-space: nowrap;\"><span style=\"color: #6E9B92;\">compute<\u002Fspan> &nbsp; <span style=\"color: #E4F2ED; font-weight: 600;\">NVIDIA · 4×GB200<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n  <div style=\"height: 6px; background: linear-gradient(90deg, #1E7361 0%, #3EDAB2 100%);\"><\u002Fdiv>\n\n  <!-- ===================== KEY RESULT BAND ===================== -->\n  <div style=\"padding: 28px 40px 0;\">\n    <div style=\"display: flex; border-radius: 14px; overflow: hidden;\">\n      <!-- left teal -->\n      <div style=\"flex: 0 0 33%; background: #3EDAB2; padding: 26px 30px 28px; color: #0A2924;\">\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; letter-spacing: 0.18em; color: #0C3B33;\">KEY RESULT — CAUSAL, NOT JUST CORRELATED<\u002Fdiv>\n        <div style=\"margin-top: 10px; line-height: 1; font-weight: 700; letter-spacing: -0.02em;\"><span style=\"font-size: 88px;\">12.8<\u002Fspan><span style=\"font-size: 46px; font-weight: 600;\">%<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top: 14px; font-size: 19px; line-height: 1.35; font-weight: 500; color: #103A33;\">of agent tool choices reverse when 10 SAE features are ablated.<\u002Fdiv>\n      <\u002Fdiv>\n      <!-- right dark -->\n      <div style=\"flex: 1; background: #06312E; padding: 26px 32px 28px;\">\n        <div style=\"font-size: 26px; font-weight: 700; color: #FFFFFF; line-height: 1.28; letter-spacing: -0.01em;\">Removing a handful of features <span style=\"color: #3EDAB2;\">causally changes<\u002Fspan> the agent's tool choice — controls stay flat at zero.<\u002Fdiv>\n        <div style=\"display: flex; gap: 14px; margin-top: 20px;\">\n          <div style=\"white-space: nowrap; font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #CFE6DF; border: 1px solid rgba(255,255,255,0.16); border-radius: 7px; padding: 8px 14px;\">random ablation <span style=\"color: #3EDAB2; font-weight: 600;\">0%<\u002Fspan><\u002Fdiv>\n          <div style=\"white-space: nowrap; font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #CFE6DF; border: 1px solid rgba(255,255,255,0.16); border-radius: 7px; padding: 8px 14px;\">SAE round-trip <span style=\"color: #3EDAB2; font-weight: 600;\">0%<\u002Fspan><\u002Fdiv>\n          <div style=\"white-space: nowrap; font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #CFE6DF; border: 1px solid rgba(255,255,255,0.16); border-radius: 7px; padding: 8px 14px;\"><span style=\"color: #3EDAB2; font-weight: 600;\">p = 0.001<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top: 18px; font-family: 'IBM Plex Mono', monospace; font-style: italic; font-size: 15.5px; color: #BFD8D1;\">also significant: single vs. multi-tool — <span style=\"color: #3EDAB2;\">17.1%<\u002Fspan> vs. <span style=\"color: #3EDAB2;\">2.4%<\u002Fspan> baseline (n = 41, p = 0.029).<\u002Fdiv>\n        <div style=\"margin-top: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #6E9B92;\">shallow vs. deep (tool selection, 1 of 23 contrast types tested) — Nemotron-3-Nano-30B (52 layers), probed at layer 20.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== BODY: 4 COLUMNS ===================== -->\n  <main style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; padding: 26px 40px 34px; align-items: start;\">\n\n    <!-- ============ COLUMN 1 ============ -->\n    <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n\n      <!-- 01 -->\n      <section style=\"background: #F8F4E4; border: 1px solid #ECE6D4; border-radius: 14px; padding: 22px 24px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 14px;\">\n          <div style=\"width: 30px; height: 30px; border-radius: 7px; background: #06312E; color: #3EDAB2; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">01<\u002Fdiv>\n          <h2 style=\"margin: 0; font-size: 21px; font-weight: 700; color: #15302B; letter-spacing: -0.01em;\">The Tool-Selection Black Box<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin: 0 0 12px; font-size: 15px; line-height: 1.55; color: #3A4A45;\">Modern AI agents autonomously pick among databases, code, web search, and sub-agents. When the agent chooses is observable — <strong style=\"color: #1E332E;\">why it chose<\u002Fstrong> remains opaque.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;\">\n          <div style=\"display: flex; gap: 10px;\"><div style=\"color: #2FB694; font-weight: 700; flex-shrink: 0;\">▪<\u002Fdiv><div style=\"font-size: 14.5px; line-height: 1.45; color: #3A4A45;\"><strong style=\"color: #1E332E;\">Prompt engineering<\u002Fstrong> — correlational, not causal.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px;\"><div style=\"color: #2FB694; font-weight: 700; flex-shrink: 0;\">▪<\u002Fdiv><div style=\"font-size: 14.5px; line-height: 1.45; color: #3A4A45;\"><strong style=\"color: #1E332E;\">Behavioural testing<\u002Fstrong> — input/output only.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px;\"><div style=\"color: #2FB694; font-weight: 700; flex-shrink: 0;\">▪<\u002Fdiv><div style=\"font-size: 14.5px; line-height: 1.45; color: #3A4A45;\"><strong style=\"color: #1E332E;\">Chain-of-thought<\u002Fstrong> — plausible, often confabulated.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #3A4A45;\">We open the black box at the token where the model <strong style=\"color: #1E332E;\">commits to a tool<\u002Fstrong>, and decompose its hidden state into human-readable features.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- 02 Pipeline -->\n      <section style=\"background: #F8F4E4; border: 1px solid #ECE6D4; border-radius: 14px; padding: 22px 24px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 14px;\">\n          <div style=\"width: 30px; height: 30px; border-radius: 7px; background: #06312E; color: #3EDAB2; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">02<\u002Fdiv>\n          <h2 style=\"margin: 0; font-size: 21px; font-weight: 700; color: #15302B; letter-spacing: -0.01em;\">Pipeline<\u002Fh2>\n        <\u002Fdiv>\n        <img src=\"e2c1567b-fa69-46d3-9637-86452930c43a\" alt=\"Training pipeline diagram\" style=\"width: 100%; display: block;\">\n        <p style=\"margin: 12px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5; color: #8A8A82;\"><span style=\"color: #2F8770; font-weight: 600;\">Fig 1.<\u002Fspan> The SAE is trained unsupervised on raw activations. Contrastive pairs enter only at the post-hoc probe (Cohen's d) — never as a training signal.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- 03 Layer -->\n      <section style=\"background: #F8F4E4; border: 1px solid #ECE6D4; border-radius: 14px; padding: 22px 24px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 14px;\">\n          <div style=\"width: 30px; height: 30px; border-radius: 7px; background: #06312E; color: #3EDAB2; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">03<\u002Fdiv>\n          <h2 style=\"margin: 0; font-size: 21px; font-weight: 700; color: #15302B; letter-spacing: -0.01em;\">Pick the Right Layer — Not the MoE Ones<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin: 0 0 14px; font-size: 15px; line-height: 1.55; color: #3A4A45;\">A single SAE cannot decompose MoE layers. Reconstruction MSE explodes by <strong style=\"color: #1E332E;\">&gt;500×<\u002Fstrong> at the sparse-routed expert layers.<\u002Fp>\n        <img src=\"1ad940ee-d4a1-4fc6-91ab-7e8259ccabf4\" alt=\"Layer sweep chart\" style=\"width: 100%; display: block; border-radius: 6px;\">\n        <p style=\"margin: 12px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5; color: #8A8A82;\"><span style=\"color: #2F8770; font-weight: 600;\">Fig 2.<\u002Fspan> Bars = alive features; line = reconstruction MSE (log). At the MoE layers MSE jumps to 1,524 (L32) and 508 (L44) — vs. 0.574 at layer 20. Layer 20 sits just before the MoE stack with 81.2% alive features.<\u002Fp>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n\n    <!-- ============ COLUMN 2 ============ -->\n    <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n\n      <!-- 04 JumpReLU -->\n      <section style=\"background: #F8F4E4; border: 1px solid #ECE6D4; border-radius: 14px; padding: 22px 24px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 14px;\">\n          <div style=\"width: 30px; height: 30px; border-radius: 7px; background: #06312E; color: #3EDAB2; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">04<\u002Fdiv>\n          <h2 style=\"margin: 0; font-size: 21px; font-weight: 700; color: #15302B; letter-spacing: -0.01em;\">JumpReLU Sparse Autoencoder<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin: 0 0 14px; font-size: 15px; line-height: 1.55; color: #3A4A45;\">An overcomplete dictionary that decomposes hidden states into <strong style=\"color: #1E332E;\">monosemantic<\u002Fstrong> features. JumpReLU thresholds θ<span class=\"kp-sup\">i<\u002Fspan> produce exact zeros — true sparsity — trained with a smooth tanh surrogate.<\u002Fp>\n        <img src=\"ef9c187c-0132-44d5-a258-2c2d26313225\" alt=\"JumpReLU SAE architecture\" style=\"width: 100%; display: block;\">\n        <div style=\"margin-top: 16px; border: 1px solid #E9E2CD; border-radius: 9px; overflow: hidden;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; border-bottom: 1px solid #EFEAD8; font-size: 14.5px; color: #3A4A45;\"><span>Dictionary size <em>M<\u002Fem><\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; color: #15302B; font-weight: 600;\">10,752 (4× hidden)<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; border-bottom: 1px solid #EFEAD8; font-size: 14.5px; color: #3A4A45;\"><span>Activations trained on<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; color: #15302B; font-weight: 600;\">1,000,000<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; border-bottom: 1px solid #EFEAD8; font-size: 14.5px; color: #3A4A45;\"><span>Reconstruction MSE<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; color: #15302B; font-weight: 600;\">0.574<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; border-bottom: 1px solid #EFEAD8; font-size: 14.5px; color: #3A4A45;\"><span>Alive features<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; color: #15302B; font-weight: 600;\">81.2%<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; font-size: 14.5px; color: #3A4A45;\"><span>Active per input<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; color: #15302B; font-weight: 600;\">668 ± 26 (6.2%)<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 12px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5; color: #8A8A82;\"><span style=\"color: #2F8770; font-weight: 600;\">Fig 3.<\u002Fspan> Encode → JumpReLU (exact zeros) → decode, with shared b_dec and unit-norm W_dec. ~58M trainable parameters; loss = MSE + tanh-smoothed L0.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- 05 Inside a Feature -->\n      <section style=\"background: #F8F4E4; border: 1px solid #ECE6D4; border-radius: 14px; padding: 22px 24px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 14px;\">\n          <div style=\"width: 30px; height: 30px; border-radius: 7px; background: #06312E; color: #3EDAB2; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">05<\u002Fdiv>\n          <h2 style=\"margin: 0; font-size: 21px; font-weight: 700; color: #15302B; letter-spacing: -0.01em;\">Inside a Feature — Emergent, Unsupervised Concepts<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin: 0 0 14px; font-size: 15px; line-height: 1.55; color: #3A4A45;\">The SAE decomposes Layer-20 activations into <strong style=\"color: #1E332E;\">10,752 features<\u002Fstrong>. Without contrastive supervision, named concepts emerge from raw activations alone:<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;\">\n          <div style=\"display:flex;align-items:center;gap:12px;background:#06312E;color:#FFFEF9;border-radius:9px;padding:13px 17px;font-size:17px;font-weight:700;letter-spacing:-0.01em;\"><span style=\"width:9px;height:9px;border-radius:2px;background:#3EDAB2;flex-shrink:0;display:inline-block;\"><\u002Fspan>“internal knowledge retrieval”<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;background:#06312E;color:#FFFEF9;border-radius:9px;padding:13px 17px;font-size:17px;font-weight:700;letter-spacing:-0.01em;\"><span style=\"width:9px;height:9px;border-radius:2px;background:#3EDAB2;flex-shrink:0;display:inline-block;\"><\u002Fspan>“data modification intent”<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;background:#06312E;color:#FFFEF9;border-radius:9px;padding:13px 17px;font-size:17px;font-weight:700;letter-spacing:-0.01em;\"><span style=\"width:9px;height:9px;border-radius:2px;background:#3EDAB2;flex-shrink:0;display:inline-block;\"><\u002Fspan>“query complexity”<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #3A4A45;\">Each feature carries an LLM-generated label, a token-level fuzzing score (aggregate <strong style=\"color: #1E332E;\">0.912 ± 0.008<\u002Fstrong>, p &lt; 10<span class=\"kp-sup\">−4<\u002Fspan>), and its row in the contrastive-ablation table.<\u002Fp>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n\n    <!-- ============ COLUMN 3 ============ -->\n    <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n\n      <!-- 06 Production -->\n      <section style=\"background: #F8F4E4; border: 1px solid #ECE6D4; border-radius: 14px; padding: 22px 24px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 14px;\">\n          <div style=\"width: 30px; height: 30px; border-radius: 7px; background: #06312E; color: #3EDAB2; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">06<\u002Fdiv>\n          <h2 style=\"margin: 0; font-size: 21px; font-weight: 700; color: #15302B; letter-spacing: -0.01em;\">Strong Focus on Production<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin: 0 0 14px; font-size: 15px; line-height: 1.55; color: #3A4A45;\">Every tool call ships with a rationale. At inference, the top-K active features at the decision token map to pre-computed labels — <strong style=\"color: #1E332E;\">no extra LLM call.<\u002Fstrong><\u002Fp>\n        <img src=\"9a98965e-3723-48ab-afa5-51e4b4348181\" alt=\"Inference pipeline diagram\" style=\"width: 100%; display: block;\">\n        <div style=\"margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:#3EDAB2;color:#06312E;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;padding:7px 13px;border-radius:8px;white-space:nowrap;\">✓ &nbsp;human-readable explanation shipped with every tool call<\u002Fdiv>\n        <p style=\"margin: 12px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5; color: #8A8A82;\"><span style=\"color: #2F8770; font-weight: 600;\">Fig 4.<\u002Fspan> Top-K active features map to pre-computed theme labels at the decision token — a debugging surface for deployed agents and a foundation for anomaly detection.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- 07 Feature Label Quality -->\n      <section style=\"background: #F8F4E4; border: 1px solid #ECE6D4; border-radius: 14px; padding: 22px 24px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 14px;\">\n          <div style=\"width: 30px; height: 30px; border-radius: 7px; background: #06312E; color: #3EDAB2; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">07<\u002Fdiv>\n          <h2 style=\"margin: 0; font-size: 21px; font-weight: 700; color: #15302B; letter-spacing: -0.01em;\">Feature Label Quality<\u002Fh2>\n        <\u002Fdiv>\n        <img src=\"b01d3e43-bb78-4a89-88e1-d9ad74485941\" alt=\"Feature label quality bar\" style=\"width: 100%; display: block;\">\n        <div style=\"margin-top: 16px; border: 1px solid #E9E2CD; border-radius: 9px; overflow: hidden;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; border-bottom: 1px solid #EFEAD8; font-size: 14.5px; color: #3A4A45;\"><span>Combined score<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; color: #15302B; font-weight: 600;\">0.912 ± 0.008<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; font-size: 14.5px; color: #3A4A45;\"><span>Token-level accuracy<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; color: #15302B; font-weight: 600;\">0.906 ± 0.007<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 12px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5; color: #8A8A82;\"><span style=\"color: #2F8770; font-weight: 600;\">Fig 5.<\u002Fspan> 402 features · 4,422 A/B examples; combined score weights token-level 0.7 vs. prompt-level 0.3 (p &lt; 10<span class=\"kp-sup\">−4<\u002Fspan> vs. 0.5). Token-level evaluation catches labels right for the wrong reasons.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- ! Scope & Limitations (dark) -->\n      <section style=\"background: #06312E; border-radius: 14px; padding: 22px 24px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 14px;\">\n          <div style=\"width: 30px; height: 30px; border-radius: 7px; background: #3EDAB2; color: #06312E; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">!<\u002Fdiv>\n          <h2 style=\"margin: 0; font-size: 21px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.01em;\">Scope &amp; Limitations<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"display: flex; gap: 10px;\"><div style=\"color: #3EDAB2; font-weight: 700; flex-shrink: 0;\">▪<\u002Fdiv><div style=\"font-size: 14.5px; line-height: 1.45; color: #CFE6DF;\">One model, one layer, one decision-token convention.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px;\"><div style=\"color: #3EDAB2; font-weight: 700; flex-shrink: 0;\">▪<\u002Fdiv><div style=\"font-size: 14.5px; line-height: 1.45; color: #CFE6DF;\">Top-10 ablation is conservative; distributed decisions need larger sets.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px;\"><div style=\"color: #3EDAB2; font-weight: 700; flex-shrink: 0;\">▪<\u002Fdiv><div style=\"font-size: 14.5px; line-height: 1.45; color: #CFE6DF;\">Feature labels rely on Qwen3-VL-235B (generation, labelling, and judge) — its errors propagate to rationales.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n\n    <!-- ============ COLUMN 4 ============ -->\n    <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n\n      <!-- 08 Causal Ablation -->\n      <section style=\"background: #F8F4E4; border: 1px solid #ECE6D4; border-radius: 14px; padding: 22px 24px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 14px;\">\n          <div style=\"width: 30px; height: 30px; border-radius: 7px; background: #06312E; color: #3EDAB2; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">08<\u002Fdiv>\n          <h2 style=\"margin: 0; font-size: 21px; font-weight: 700; color: #15302B; letter-spacing: -0.01em;\">Causal Ablation<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin: 0 0 14px; font-size: 15px; line-height: 1.55; color: #3A4A45;\">Prediction-flip rate by contrast type — significance shown per group.<\u002Fp>\n        <img src=\"b183ba32-c6c1-4816-a24c-b450039dca34\" alt=\"Feature ablation causal evidence chart\" style=\"width: 100%; display: block;\">\n        <div style=\"display: flex; flex-direction: column; gap: 9px; margin: 16px 0 0;\">\n          <div style=\"display: flex; gap: 10px;\"><div style=\"color: #2FB694; font-weight: 700; flex-shrink: 0;\">▪<\u002Fdiv><div style=\"font-size: 14.5px; line-height: 1.45; color: #3A4A45;\"><strong style=\"color: #1E332E;\">Works:<\u002Fstrong> fundamental vs. technical — 10.1% flip, controls 0% (p = 0.002).<\u002Fdiv><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px;\"><div style=\"color: #2FB694; font-weight: 700; flex-shrink: 0;\">▪<\u002Fdiv><div style=\"font-size: 14.5px; line-height: 1.45; color: #3A4A45;\"><strong style=\"color: #1E332E;\">Works:<\u002Fstrong> single vs. multi-tool — 17.1% vs. 2.4% baseline (n = 41, p = 0.029).<\u002Fdiv><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px;\"><div style=\"color: #2FB694; font-weight: 700; flex-shrink: 0;\">▪<\u002Fdiv><div style=\"font-size: 14.5px; line-height: 1.45; color: #3A4A45;\"><strong style=\"color: #1E332E;\">Null:<\u002Fstrong> 9 of 23 contrast types show zero flip — encoded distributively, not in a sparse circuit.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 14px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.55; color: #7E8B86;\"><strong style=\"color: #2F8770;\">Why it's real:<\u002Fstrong> random-ablation flip equals SAE round-trip distortion across all 23 types. The contrastive flip sits <strong style=\"color: #45504C;\">above this noise floor<\u002Fstrong> — it comes from the specific features removed, not encode/decode artefacts.<\u002Fp>\n\n        <!-- NEW: Figure 7 -->\n        <div style=\"margin-top: 18px; padding-top: 18px; border-top: 1px solid #EAE3CE;\">\n          <img src=\"231c4ce7-4767-4ce5-a60d-2b7ba94da8d8\" alt=\"CATE scaling staircase chart\" style=\"width: 100%; display: block;\">\n          <p style=\"margin: 12px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5; color: #8A8A82;\"><span style=\"color: #2F8770; font-weight: 600;\">Fig 7.<\u002Fspan> CATE (Δ Prob %) by contrast type across Top-10 / 20 / 30 feature interventions; 500 prompts. The staircase rise with intervention size signals distributed causal encoding.<\u002Fp>\n          <p style=\"margin: 12px 0 0; font-size: 15px; line-height: 1.55; color: #3A4A45;\">We apply targeted activation patching across expanding feature dimensions (Top 10, 20, 30 features) to measure the Conditional Average Treatment Effect (CATE). The resulting “<em>staircase scaling effect<\u002Fem>” across categories like <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 0.92em;\">single_vs_batch<\u002Fspan> and <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 0.92em;\">specific_vs_broad<\u002Fspan> confirms that abstract tool parameters are <strong style=\"color: #1E332E;\">governed by distributed causal circuits<\u002Fstrong> rather than localized bottlenecks. All plotted trajectories are highly robust, consistently clearing the Wilcoxon signed-rank test at <em>p<\u002Fem> &lt; 0.001.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- Code & Paper (dark, no Prior Work) -->\n      <section style=\"background: #06312E; border-radius: 14px; padding: 22px 24px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 16px;\">\n          <div style=\"width: 30px; height: 30px; border-radius: 7px; background: #3EDAB2; color: #06312E; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">↗<\u002Fdiv>\n          <h2 style=\"margin: 0; font-size: 21px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.01em;\">Code &amp; Paper<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 15.5px; color: #3EDAB2; margin-bottom: 18px;\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 16 16\" fill=\"#3EDAB2\" style=\"flex-shrink:0;\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg>\n          github.com/dataiku/kiji-inspector\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 9px; white-space: nowrap; font-family: 'IBM Plex Mono', monospace; font-size: 14.5px;\">\n          <div style=\"display: flex; gap: 14px;\"><span style=\"color: #6E9B92; width: 150px; flex-shrink: 0;\">SUBJECT<\u002Fspan><span style=\"color: #E4F2ED; font-weight: 600;\">Nemotron-3-Nano-30B<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px;\"><span style=\"color: #6E9B92; width: 150px; flex-shrink: 0;\">GEN·LABEL·JUDGE<\u002Fspan><span style=\"color: #E4F2ED; font-weight: 600;\">Qwen3-VL-235B<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px;\"><span style=\"color: #6E9B92; width: 150px; flex-shrink: 0;\">COMPUTE<\u002Fspan><span style=\"color: #E4F2ED; font-weight: 600;\">NVIDIA · 4×GB200<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n\n  <\u002Fmain>\n\n  <!-- ===================== FOOTER ===================== -->\n  <div style=\"height: 6px; background: linear-gradient(90deg, #3EDAB2 0%, #1E7361 100%);\"><\u002Fdiv>\n  <footer style=\"background: #06312E; color: #8FB7AF; padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 14px;\">\n    <span><span style=\"color: #3EDAB2;\">github.com/dataiku/kiji-inspector<\u002Fspan> &nbsp;·&nbsp; Mechanistic Interpretability for AI Agents<\u002Fspan>\n    <span style=\"color: #3EDAB2;\">hannes.hapke@dataiku.com &nbsp;·&nbsp; david.cardozo@dataiku.com<\u002Fspan>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
