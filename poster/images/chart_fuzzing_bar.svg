<?xml version="1.0" encoding="UTF-8"?>
<!-- Stacked-bar SVG replicating poster.tex's TikZ fuzzing-tiers chart.
     Bar 20cm x 4.2cm at 30 px/cm -> 600 x 126 px. Good and Poor segments are
     narrow, so their leaders drop to two different depths and the callouts
     sit centered under each leader (one row each); avoids the horizontal
     collision the side-by-side TikZ layout shows at SVG sizes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 220" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <!-- Bar segments -->
  <rect x="20"    y="10" width="505.8" height="126" fill="#06312E"/>
  <rect x="525.8" y="10" width="56.4"  height="126" fill="#3EDAB2"/>
  <rect x="582.2" y="10" width="37.8"  height="126" fill="#F8F4E4"/>
  <!-- Bar outline -->
  <rect x="20" y="10" width="600" height="126" fill="none" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Hero label inside the Excellent segment -->
  <text x="272.9" y="72" text-anchor="middle" font-size="60" font-weight="700" fill="#FFFEF9">84.3 %</text>
  <text x="272.9" y="112" text-anchor="middle" font-size="22" fill="#FFFEF9">Excellent (&gt; 0.8)</text>

  <!-- Good: short leader, label one row below the bar -->
  <line x1="554"   y1="136" x2="554"   y2="158" stroke="#1A1A1A" stroke-width="1"/>
  <text x="554"   y="178" text-anchor="middle" font-size="16" font-weight="600" fill="#1A1A1A">Good 9.4 %</text>

  <!-- Poor: longer leader, label on the row below Good so they don't collide -->
  <line x1="601.1" y1="136" x2="601.1" y2="190" stroke="#1A1A1A" stroke-width="1"/>
  <text x="601.1" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#1A1A1A">Poor 6.2 %</text>
</svg>
